name: Publish signed Windows release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $configVersion = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tagVersion -ne $configVersion -or $tagVersion -ne $cargoVersion) {
            throw "Release tag ($tagVersion), tauri.conf.json ($configVersion), and Cargo.toml ($cargoVersion) versions must match."
          }

      - name: Verify updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Configure the TAURI_SIGNING_PRIVATE_KEY repository Actions secret before publishing."
          }

      - name: Verify publisher build variables
        shell: pwsh
        env:
          ARCA_MICROSOFT_CLIENT_ID: ${{ vars.ARCA_MICROSOFT_CLIENT_ID }}
          ARCA_CURSEFORGE_PROXY_URL: ${{ vars.ARCA_CURSEFORGE_PROXY_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARCA_MICROSOFT_CLIENT_ID)) {
            throw "Configure the ARCA_MICROSOFT_CLIENT_ID repository Actions variable."
          }
          if ([string]::IsNullOrWhiteSpace($env:ARCA_CURSEFORGE_PROXY_URL)) {
            throw "Configure the ARCA_CURSEFORGE_PROXY_URL repository Actions variable."
          }

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ARCA_MICROSOFT_CLIENT_ID: ${{ vars.ARCA_MICROSOFT_CLIENT_ID }}
          ARCA_CURSEFORGE_PROXY_URL: ${{ vars.ARCA_CURSEFORGE_PROXY_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Arca Launcher ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  release-macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ARCA_MICROSOFT_CLIENT_ID: ${{ vars.ARCA_MICROSOFT_CLIENT_ID }}
          ARCA_CURSEFORGE_PROXY_URL: ${{ vars.ARCA_CURSEFORGE_PROXY_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Arca Launcher ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false

  release-linux:
    needs: release-macos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ARCA_MICROSOFT_CLIENT_ID: ${{ vars.ARCA_MICROSOFT_CLIENT_ID }}
          ARCA_CURSEFORGE_PROXY_URL: ${{ vars.ARCA_CURSEFORGE_PROXY_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Arca Launcher ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
